plugins { id "com.android.application" }

// Release signing, as in MiuiBackGestureHook: keystore.properties (storeFile, storePassword,
// keyAlias, keyPassword) in the project root, or SIGNING_KEY / KEYSTORE_PASSWORD / ALIAS /
// KEY_PASSWORD from the environment. Both are kept out of the repository.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.isFile()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingProperty = { String name ->
    def value = keystoreProperties.getProperty(name)
    value != null && !value.isBlank() ? value : null
}
def localSigning = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
        .collectEntries { [(it): signingProperty(it)] }
def hasLocalSigning = localSigning.values().every { it != null }
def envSigning = [storeFile: System.getenv("SIGNING_KEY"),
                  storePassword: System.getenv("KEYSTORE_PASSWORD"),
                  keyAlias: System.getenv("ALIAS"),
                  keyPassword: System.getenv("KEY_PASSWORD")]
def hasEnvSigning = envSigning.values().every { it != null && !it.isBlank() }

android {
    namespace "io.github.wxxsfxyzm.codecinjector"
    compileSdk 37
    ndkVersion "30.0.16138531"

    defaultConfig {
        applicationId "io.github.wxxsfxyzm.codecinjector"
        minSdk 37
        targetSdk 37
        versionCode 130
        versionName "1.0.5"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_static" } }
    }

    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt"); version "4.1.2" }
    }
    signingConfigs {
        release {
            if (hasLocalSigning) {
                storeFile rootProject.file(localSigning.storeFile)
                storePassword localSigning.storePassword
                keyAlias localSigning.keyAlias
                keyPassword localSigning.keyPassword
            } else if (hasEnvSigning) {
                storeFile file(envSigning.storeFile)
                storePassword envSigning.storePassword
                keyAlias envSigning.keyAlias
                keyPassword envSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasLocalSigning || hasEnvSigning) signingConfig signingConfigs.release
        }
        release {
            // R8 shrinking without obfuscation (see proguard-rules.pro).
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasLocalSigning || hasEnvSigning) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig false }
    // Kotlin metadata of kotlin-stdlib (pulled in by DexKit); nothing here reads it.
    packaging {
        jniLibs {
            // The module carries its own SSC encoder; never package a proprietary one left in jniLibs.
            excludes += ["**/libScalable_Encoder.so"]
        }
        resources {
            excludes += ["kotlin/**", "META-INF/*.kotlin_module", "META-INF/*.version",
                         "DebugProbesKt.bin"]
        }
    }
}

dependencies {
    implementation project(":core")
    implementation project(":codec-ssc")
    implementation project(":codec-aeld")
    compileOnly "io.github.libxposed:api:102.0.0"
    // Hidden framework API stubs, so that R8 knows them as library classes (not packaged).
    compileOnly project(":hidden-api")
}
